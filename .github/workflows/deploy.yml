name: Launch deploy (GitHub Pages)

# The real launch: builds the site in launch mode (a missing optional fact leaves no trace) and publishes it, indexable.
# Run it by hand (Actions › Launch deploy › Run workflow) once the client's facts are in and the preview is approved;
# disable « Client preview » first, or its next run replaces the launched site (both publish to the same Pages site).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, shared with preview.yml; a newer run replaces a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from https://<owner>.github.io/<repo>/ until the custom domain (atlasprotvofficial.com) serves the site
      # from the root: then set the repository variable BASE_PATH to "/" (Settings › Secrets and variables › Actions
      # › Variables). Canonical URLs, hreflang, og:image and the sitemap always use the domain of src/lib/facts.data.ts.
      BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      # Launch mode for the client build and the prerender alike (they must match, or hydration breaks).
      VITE_PENDING: launch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A site with holes is not published: lists the required facts still missing from src/lib/facts.data.ts and
      # stops the deploy while any is missing.
      - name: Launch check (required facts)
        run: npm run launch-check
      - run: npm run lint
      # Type-check, client build, server build, prerender of every page in every language (+ 404.html), sitemap.xml
      # and the Sitemap line of robots.txt: dist/ is the complete site.
      - name: Build
        run: npm run build
      # The client's content rules, checked on the built pages (no Arabic, no platform names, no 4K for live TV,
      # WhatsApp links, translations complete).
      - name: Content check
        run: npm run check-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
