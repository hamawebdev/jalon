name: Client preview (GitHub Pages)

# The site for the client to review while facts and translations are still coming in: built in review mode, so every
# missing fact shows its « À compléter » marker, and kept out of search results (noindex on every page). It does not
# run the launch check. For the real launch, disable this workflow (Actions › Client preview › Disable workflow) and
# run deploy.yml: both publish to the same GitHub Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, shared with deploy.yml; a newer push replaces a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Review mode for the client build and the prerender alike (they must match, or hydration breaks).
      VITE_PENDING: review
      BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Type-check, client build, prerender of every page in every language (+ 404.html), sitemap.
      - name: Build
        run: npm run build
      # noindex, nofollow on every prerendered page and on 404.html.
      - name: Keep the preview out of search results
        run: node scripts/preview-noindex.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
